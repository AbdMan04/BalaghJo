name: balaghjo
description: BALAGHJO civic reporting app
publish_to: "none"

version: 0.1.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.2
  http_parser: ^4.0.2
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  image_picker: ^1.1.2
  geolocator: ^12.0.0
  intl: ^0.20.2
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.0
  flutter_svg: ^2.0.10+1
  cached_network_image: ^3.4.1
  firebase_core: ^4.12.1
  share_plus: ^13.3.0
  flutter_localizations:
    sdk: flutter
  firebase_messaging: ^16.4.3
  flutter_local_notifications: ^19.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/icons/quick_report/
    - "assets/icons/quick_report/playstore.png"

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-400.ttf
          weight: 400
        - asset: assets/fonts/Cairo-500.ttf
          weight: 500
        - asset: assets/fonts/Cairo-600.ttf
          weight: 600
        - asset: assets/fonts/Cairo-700.ttf
          weight: 700
        - asset: assets/fonts/Cairo-800.ttf
          weight: 800
        - asset: assets/fonts/Cairo-900.ttf
          weight: 900

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/quick_report/playstore.png"
  adaptive_icon_background: "#0B7F78"
  adaptive_icon_foreground: "assets/icons/quick_report/playstore.png"
  