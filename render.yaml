# Render Blueprint for BALAGHJO — dashboard (Flutter web).
#
# The API is intentionally NOT defined here: the existing service at
# balaghjo.onrender.com is the single source of truth and the dashboard
# points at it via the API_BASE_URL default in frontend/lib/core/config.dart.
#
# The dashboard is a Docker web service because Render's native runtimes and
# static sites cannot run the Flutter SDK; the multi-stage Dockerfile builds
# the bundle with the official Flutter image and serves it with nginx.
services:
  - type: web
    name: balaghjo-dashboard
    runtime: docker
    plan: free
    dockerfilePath: frontend/Dockerfile
    dockerContext: frontend
    autoDeploy: true
    buildFilter:
      paths:
         frontend/**
